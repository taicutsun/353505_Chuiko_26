{% extends "base.html" %}
{% block content %}
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Сотрудники</h1>
      <a href="{% url 'employee_add' %}" class="btn btn-primary">Добавить сотрудника</a>
    </div>

    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Фото</th>
            <th>Профиль</th>
            <th>Должность</th>
            <th>Зарплата</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {% for employee in object_list %}
            <tr>
              <td>
                <img src="{{ employee.photo.url }}" alt="Employee photo" 
                     class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover;">
              </td>
              <td>{{ employee.profile }}</td>
              <td>{{ employee.position }}</td>
              <td>{{ employee.salary }}</td>
              <td>
                <a href="{% url 'employee_edit' employee.pk %}" class="btn btn-sm btn-outline-primary">Изменить</a>
                <a href="{% url 'employee_delete' employee.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
