{% extends "base.html" %}
{% block content %}
  <h1>Удалить сотрудника</h1>
  <p>Вы уверены, что хотите удалить сотрудника "{{ object }}"?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'employee_list' %}">Отмена</a>
  </form>
{% endblock %}
