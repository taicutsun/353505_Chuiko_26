{% extends 'base.html' %}
{% load static %}

{% block title %}Медиа - Агентство недвижимости{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/base.css' %}" media="all">
{% endblock %}

{% block content %}
    <div class="content">
        <h1>Медиа элементы</h1>

        <section id="media" aria-labelledby="media-title">
            <h2 id="media-title">Видео, аудио и встраивания</h2>
            <div class="media-grid">
              <article>
                <h3>Видео</h3>
                <video controls width="480" poster="https://via.placeholder.com/480x270?text=Video">
                  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                  Ваш браузер не поддерживает видео.
                </video>
              </article>
              <article>
                <h3>Аудио</h3>
                <audio controls>
                  <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                  Ваш браузер не поддерживает аудио.
                </audio>
              </article>
              <article>
                <h3>Карта</h3>
                <iframe
                  title="OpenStreetMap"
                  width="480" height="270" style="border:0" loading="lazy" allowfullscreen
                  src="https://www.openstreetmap.org/export/embed.html?bbox=27.55%2C53.9%2C27.7%2C53.95&layer=mapnik">
                </iframe>
              </article>
            </div>
          </section>
    </div>
{% endblock %}
